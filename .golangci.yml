version: "2"

run:
  tests: true
  modules-download-mode: readonly

linters:
  enable:
    - errcheck      # Check for unchecked errors
    - govet         # Go vet
    - ineffassign   # Detect ineffectual assignments
    - staticcheck   # Static analysis (includes gosimple)
    - unused        # Detect unused code
    - misspell      # Check for misspellings
    - revive        # Fast linter
    - gosec         # Security checks
    - gocritic      # Comprehensive linter
    - gocyclo       # Cyclomatic complexity
    - dupl          # Duplicate code detection
    - unparam       # Unused function parameters
    - unconvert     # Unnecessary type conversions
    - prealloc      # Preallocate slices
    - nilerr        # Nil error returns
    - bodyclose     # HTTP body close
    - noctx         # HTTP request without context

  settings:
    errcheck:
      check-type-assertions: true
      check-blank: false
      exclude-functions:
        - (io.Closer).Close
        - (*os.File).Close
        - fmt.Fprintf
        - fmt.Fprint
        - fmt.Fprintln

    govet:
      enable-all: true
      disable:
        - fieldalignment
        - shadow

    gocyclo:
      min-complexity: 15

    dupl:
      threshold: 100

    gosec:
      severity: medium
      confidence: medium
      excludes:
        - G104 # Audit errors not checked - covered by errcheck
        - G204 # Command injection - required for test scripts

    gocritic:
      enabled-tags:
        - diagnostic
        - style
        - performance
      disabled-checks:
        - commentedOutCode
        - unnecessaryBlock

    revive:
      rules:
        - name: exported
          disabled: true
        - name: package-comments
          disabled: true

    misspell:
      locale: US

  exclusions:
    generated: lax
    presets: []   # Disable default exclusions (was: exclude-use-default: false)
    rules:
      # Exclude some linters from running on test files
      - path: _test\.go
        linters:
          - gocyclo
          - errcheck
          - dupl
          - gosec
          - gocritic

      # Exclude BPF generated code
      - path: tracer_bpf.*\.go
        linters:
          - errcheck
          - govet
          - ineffassign
          - staticcheck
          - unused
          - misspell
          - revive
          - gosec
          - gocritic
          - gocyclo
          - dupl
          - unparam
          - unconvert
          - prealloc
          - nilerr
          - bodyclose
          - noctx

      # Allow complex main functions
      - path: main\.go
        linters:
          - gocyclo

      # Allow complex CLI root command
      - path: cmd/root\.go
        linters:
          - gocyclo

formatters:
  enable:
    - gofmt      # Check formatting
    - goimports  # Check imports

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
